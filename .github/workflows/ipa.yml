name: Build unsigned iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Build for iPhone
        run: |
          set -o pipefail
          xcodebuild build \
            -project PandaBeFree.xcodeproj \
            -scheme PandaBeFree \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            | tee build.log
      - name: Package unsigned IPA
        run: |
          mkdir -p output/Payload
          cp -R build/Build/Products/Release-iphoneos/PandaBeFree.app output/Payload/
          test -f output/Payload/PandaBeFree.app/PandaBeFree
          cd output
          /usr/bin/zip -qr PandaBeFree-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PandaBeFree-iPhone
          path: output/PandaBeFree-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
